# Provider: Azure OpenAI (untested).
# Secret:   kubectl create secret generic lab-provider-keys -n dify-lab \
#             --from-literal=AZURE_API_KEY="$(pbpaste)" \
#             --from-literal=AZURE_API_BASE=https://<your-resource>.openai.azure.com \
#             --from-literal=AZURE_API_VERSION=<API version your resource supports>
# Model:    "azure/<deployment>" uses YOUR deployment name, not the model name.
model_list:
  - model_name: copilot-model
    litellm_params:
      model: azure/<your-deployment-name>
      api_key: os.environ/AZURE_API_KEY
      api_base: os.environ/AZURE_API_BASE
      api_version: os.environ/AZURE_API_VERSION
  # Knowledge-base embeddings always stay local, whatever the chat provider.
  - model_name: lab-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://lab-ollama:11434
    model_info: {mode: embedding}
litellm_settings:
  drop_params: true
