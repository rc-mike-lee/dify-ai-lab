# Provider: OpenAI API (untested).
# Secret:   kubectl create secret generic lab-provider-keys -n dify-lab --from-literal=OPENAI_API_KEY="$(pbpaste)"
# Model:    any current small model with tool calling; replace gpt-4o-mini if your org uses another.
model_list:
  - model_name: copilot-model
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  # Knowledge-base embeddings always stay local, whatever the chat provider.
  - model_name: lab-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://lab-ollama:11434
    model_info: {mode: embedding}
litellm_settings:
  drop_params: true
