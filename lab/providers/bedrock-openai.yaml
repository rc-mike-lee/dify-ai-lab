# Provider: OpenAI open-weight models hosted on Amazon Bedrock (untested).
# Auth:     same as bedrock-claude.yaml (IRSA preferred).
# Model:    enable the model under Bedrock "Model access" and copy its model ID from the console.
#           Check it supports tool use; the Copilot depends on it.
model_list:
  - model_name: copilot-model
    litellm_params:
      model: bedrock/<openai-model-id-from-bedrock-console>
      aws_region_name: us-east-1
  # Knowledge-base embeddings always stay local, whatever the chat provider.
  - model_name: lab-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://lab-ollama:11434
    model_info: {mode: embedding}
litellm_settings:
  drop_params: true
