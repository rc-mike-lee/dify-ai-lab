# Provider: Anthropic API (tested).
# Secret:   kubectl create secret generic lab-provider-keys -n dify-lab --from-literal=ANTHROPIC_API_KEY="$(pbpaste)"
model_list:
  - model_name: copilot-model
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # Knowledge-base embeddings always stay local, whatever the chat provider.
  - model_name: lab-embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://lab-ollama:11434
    model_info: {mode: embedding}
litellm_settings:
  drop_params: true
