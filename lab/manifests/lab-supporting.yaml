apiVersion: v1
kind: Service
metadata:
  name: lab-customer-db
  labels:
    app: lab-customer-db
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: data-store
spec:
  selector: {app: lab-customer-db}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-customer-db
  labels:
    app: lab-customer-db
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: data-store
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-customer-db
  labels:
    app: lab-customer-db
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: data-store
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: lab-customer-db}
  template:
    metadata:
      labels:
        app: lab-customer-db
        app.kubernetes.io/part-of: ai-lab
        app.kubernetes.io/component: data-store
    spec:
      serviceAccountName: lab-customer-db
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: crm}
            - {name: POSTGRES_USER, value: crm}
            # Synthetic data, reachable only in-cluster: no password, so no Secret to manage.
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}
          ports:
            - {name: postgres, containerPort: 5432}
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "crm", "-d", "crm"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: "50m",  memory: "128Mi"}
            limits:   {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: init
          configMap: {name: lab-customer-db-init}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-mcp-crm-server
  labels:
    app: lab-mcp-crm
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: mcp-server
data:
  server.py: |
    """CRM MCP server: customer lookup and tickets over streamable HTTP at /mcp."""
    import os

    import psycopg
    from psycopg.rows import dict_row
    from mcp.server.fastmcp import FastMCP

    DSN = os.environ["DSN"]
    mcp = FastMCP("crm", host="0.0.0.0", port=3000, stateless_http=True)


    def query(sql, args=()):
        with psycopg.connect(DSN, row_factory=dict_row) as conn:
            rows = conn.execute(sql, args).fetchall()
        return [{k: str(v) for k, v in r.items()} for r in rows]


    @mcp.tool()
    def lookup_customer(query_text: str) -> list[dict]:
        """Find customer records by name, email, or customer id. Returns full records."""
        if query_text.strip().isdigit():
            return query("SELECT * FROM customers WHERE id = %s", (int(query_text),))
        like = f"%{query_text}%"
        return query("SELECT * FROM customers WHERE full_name ILIKE %s OR email ILIKE %s LIMIT 5",
                     (like, like))


    @mcp.tool()
    def get_customer_tickets(customer_id: int) -> list[dict]:
        """List support tickets for a customer id, newest first."""
        return query("SELECT id, opened, status, subject, body FROM tickets "
                     "WHERE customer_id = %s ORDER BY opened DESC", (customer_id,))


    @mcp.tool()
    def list_open_tickets() -> list[dict]:
        """List all open or pending support tickets with the customer name."""
        return query("SELECT t.id, t.customer_id, c.full_name, t.opened, t.status, t.subject "
                     "FROM tickets t JOIN customers c ON c.id = t.customer_id "
                     "WHERE t.status IN ('open', 'pending') ORDER BY t.opened DESC")


    if __name__ == "__main__":
        mcp.run(transport="streamable-http")
---
apiVersion: v1
kind: Service
metadata:
  name: lab-mcp-crm
  labels:
    app: lab-mcp-crm
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: mcp-server
spec:
  selector: {app: lab-mcp-crm}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-mcp-crm
  labels:
    app: lab-mcp-crm
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: mcp-server
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-mcp-crm
  labels:
    app: lab-mcp-crm
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-mcp-crm}
  template:
    metadata:
      labels:
        app: lab-mcp-crm
        app.kubernetes.io/part-of: ai-lab
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: lab-mcp-crm
      containers:
        - name: mcp
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - pip install --no-cache-dir --quiet 'mcp>=1.9,<2' 'psycopg[binary]>=3.2,<4' && exec python /app/server.py
          env:
            - {name: DSN, value: "postgresql://crm@lab-customer-db:5432/crm"}
          ports:
            - {name: http, containerPort: 3000}
          volumeMounts:
            - {name: server, mountPath: /app}
          readinessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: "50m",  memory: "128Mi"}
            limits:   {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: server
          configMap: {name: lab-mcp-crm-server}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-ollama
  labels:
    app: lab-ollama
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: model-server
spec:
  selector: {app: lab-ollama}
  ports:
    - {name: http, port: 11434, targetPort: 11434}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-ollama
  labels:
    app: lab-ollama
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: model-server
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-ollama
  labels:
    app: lab-ollama
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: model-server
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-ollama}
  template:
    metadata:
      labels:
        app: lab-ollama
        app.kubernetes.io/part-of: ai-lab
        app.kubernetes.io/component: model-server
    spec:
      serviceAccountName: lab-ollama
      containers:
        - name: ollama
          image: ollama/ollama:0.40.6
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              until ollama list >/dev/null 2>&1; do sleep 1; done
              for m in $OLLAMA_PULL; do ollama pull "$m"; done
              wait
          env:
            # Listen on all interfaces so the Service can reach it.
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            # Models to pull at startup. The local-only provider adds a chat model here.
            - {name: OLLAMA_PULL, value: "nomic-embed-text"}
          ports:
            - {name: http, containerPort: 11434}
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
          # HTTP probe, not the ollama CLI: CLI calls go over loopback, which the sensor
          # reads as outbound inference and raises a SHADOW-AI-EGRESS concern each time.
          readinessProbe:
            httpGet: {path: /api/tags, port: 11434}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits:   {cpu: "2",    memory: "2Gi"}
      volumes:
        - name: models
          emptyDir: {sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-litellm
  labels:
    app: lab-litellm
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: gateway
spec:
  selector: {app: lab-litellm}
  ports:
    - {name: http, port: 4000, targetPort: 4000}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-litellm
  labels:
    app: lab-litellm
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-litellm
  labels:
    app: lab-litellm
    app.kubernetes.io/part-of: ai-lab
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: lab-litellm}
  template:
    metadata:
      labels:
        app: lab-litellm
        app.kubernetes.io/part-of: ai-lab
        app.kubernetes.io/component: gateway
        # Lets the RoonCyber sensor intercept this pod's outbound TLS (OpenSSL), so the
        # content of calls to Anthropic is visible, not just the destination.
        com.rooncyber.generic-tls: "true"
    spec:
      serviceAccountName: lab-litellm
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.103.1
          args: ["--config", "/etc/litellm/config.yaml", "--host", "0.0.0.0", "--port", "4000"]
          # Credentials for the chosen provider, as env vars (ANTHROPIC_API_KEY, OPENAI_API_KEY,
          # AZURE_API_KEY/AZURE_API_BASE/AZURE_API_VERSION, or AWS keys). Empty for Bedrock with
          # IRSA or for the local-only provider.
          envFrom:
            - secretRef: {name: lab-provider-keys}
          ports:
            - {name: http, containerPort: 4000}
          volumeMounts:
            - {name: config, mountPath: /etc/litellm}
          readinessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: "50m",  memory: "768Mi"}
            limits:   {cpu: "500m", memory: "1536Mi"}
      volumes:
        - name: config
          configMap: {name: lab-litellm-config}
