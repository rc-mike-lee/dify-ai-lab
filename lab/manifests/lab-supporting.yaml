# AI workload lab: the services the Customer Support Copilot uses, besides Dify itself.
# Apply into the same namespace as Dify, BEFORE configuring Dify (it checks each model and
# MCP server when you register them):
#
#   kubectl apply -n dify-lab -f lab/manifests/lab-supporting.yaml
#
# Needs, in the namespace first: ConfigMap `lab-litellm-config` (from lab/providers/<provider>.yaml)
# and Secret `lab-provider-keys` (that provider's credentials). See README step 1.
#
#   lab-customer-db  Postgres with SYNTHETIC customer records (fake PII: SSNs in the
#                    never-issued 900-xx range, @example.com addresses)
#   lab-mcp-crm      MCP server (streamable HTTP, http://lab-mcp-crm:3000/mcp) that queries
#                    lab-customer-db. lookup_customer returns full records on purpose: an
#                    over-broad tool, a common real-world pattern.
#   lab-ollama       Local model server for knowledge-base embeddings (nomic-embed-text)
#   lab-litellm      App-owned AI gateway. Dify calls http://lab-litellm:4000/v1:
#                      copilot-model -> the provider chosen in lab/providers/ (Anthropic, OpenAI,
#                                       Azure OpenAI, Bedrock, or local Ollama)
#                      lab-embed     -> lab-ollama (nomic-embed-text)
#
# Needs outbound access to pypi.org (lab-mcp-crm installs packages at startup),
# registry.ollama.ai (model pull) and your model provider's API.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-customer-db-init
